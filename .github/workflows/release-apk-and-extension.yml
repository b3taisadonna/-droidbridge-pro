name: Build APK & Chrome Extension Release

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Chrome Extension (Manifest V3) packen
        run: |
          mkdir -p dist
          (cd chrome-extension && zip -r "../dist/DroidBridge-Pro-Chrome-Extension-MV3.zip" .)
          ls -la dist/

      - name: GitHub Release mit Download-Links veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0-pro
          name: DroidBridge Pro v2.4.0-pro
          body: |
            ## DroidBridge Pro v2.4.0-pro

            - Chrome Extension (Manifest V3) bereit zum Download
            - Android APK folgt, sobald das Gradle-Projekt vollständig ist

            ### Download
            - **Chrome Extension:** [DroidBridge-Pro-Chrome-Extension-MV3.zip](https://github.com/b3taisadonna/-droidbridge-pro/releases/download/v2.4.0-pro/DroidBridge-Pro-Chrome-Extension-MV3.zip)
          generate_release_notes: true
          files: |
            dist/DroidBridge-Pro-Chrome-Extension-MV3.zip
          fail_on_unmatched_files: false
